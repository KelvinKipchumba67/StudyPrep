name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # dummy values, only so the build can run
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      GROQ_API_KEY: dummy
      JWT_SECRET: dummy-secret-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
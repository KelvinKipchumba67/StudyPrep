name: Post-deploy smoke test

on:
  deployment_status:

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Let the deployment settle
        run: sleep 15

      - name: Health check (app and database)
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "${{ vars.PROD_URL }}/api/health"

      - name: Home page loads
        run: curl --fail --silent --show-error --output /dev/null "${{ vars.PROD_URL }}/"

      - name: Protected API rejects anonymous requests
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ vars.PROD_URL }}/api/flashcards" -H "Content-Type: application/json" -d '{}')
          echo "Status: $status"
          [ "$status" = "401" ]